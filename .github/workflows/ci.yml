name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"        # nightly: longer fuzzing campaign (see the `fuzz` job)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests experiments
      - run: mypy
      - run: bandit -q -c pyproject.toml -r src

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --require-hashes -r requirements.lock --strict

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests with coverage gate (browser e2e runs in its own job)
        run: |
          coverage run -m pytest -q --ignore=tests/e2e
          coverage report --fail-under=90

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,e2e]"
      - run: playwright install --with-deps chromium
      - run: pytest -q tests/e2e

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/security/test_fuzz_parsers.py
        env:
          HYPOTHESIS_PROFILE: soak

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t android-forensics:ci .
      - run: docker run --rm android-forensics:ci --version
      - name: Smoke: analyse synthetic evidence read-only with no network
        run: |
          docker run --rm android-forensics:ci synth /tmp/syn >/dev/null
          docker run --rm --network none --read-only --tmpfs /tmp android-forensics:ci analyze /tmp/syn/android_dump --cases-dir /tmp/cases --name smoke --no-report

  binary:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[binary]"
      - run: python packaging/build_binary.py
      - run: ./dist/android-forensics --version
        shell: bash
