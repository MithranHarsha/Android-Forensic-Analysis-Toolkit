# nginx alternative to Caddy. Terminate TLS here and run the app with:  --behind-proxy --allowed-host forensics.example.org
server {
    listen 443 ssl http2;
    server_name forensics.example.org;
    ssl_certificate     /etc/letsencrypt/live/forensics.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forensics.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64g;          # = --max-upload-gb
    proxy_request_buffering off;       # stream uploads straight to the app instead of buffering them on the proxy's disk
    proxy_read_timeout 6h;
    proxy_send_timeout 6h;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: the app trusts exactly one hop
        proxy_set_header X-Forwarded-Proto https;
    }
}
server { listen 80; server_name forensics.example.org; return 301 https://$host$request_uri; }
