[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-deleted-data-recovery"
version = "0.3.0"
description = "Android forensic toolkit: evidence ingestion, SQLite discovery, active-artifact extraction, deleted-record recovery, carving, correlation, confidence scoring, timeline and reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "fpdf2>=2.7",
    "defusedxml>=0.7",
    "cryptography>=42",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
dev = [
    "pytest>=8", "httpx>=0.27", "pypdf>=4", "coverage>=7", "matplotlib>=3.8",
    "ruff>=0.5", "mypy>=1.10", "bandit>=1.7", "hypothesis>=6.100", "pip-audit>=2.7", "pip-tools>=7", "pytest-timeout>=2.3",
]
binary = ["pyinstaller>=6"]
e2e = ["playwright>=1.40"]
docs = ["mkdocs>=1.6"]

[project.scripts]
android-forensics = "android_forensics.cli.app:main"

[project.gui-scripts]
android-forensics-gui = "android_forensics.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
android_forensics = ["reporting/templates/*.j2", "dashboard/web/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "B905", "UP031", "UP007", "B007"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E741", "E702"]

[tool.mypy]
python_version = "3.11"
files = ["src/android_forensics"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B311", "B608"]
